name: Captura continua

# ADVERTENCIA DE VIABILIDAD
# Los runners de GitHub estan alojados fuera de Colombia. BetPlay es un operador
# con licencia local y puede aplicar bloqueo geografico, en cuyo caso este flujo
# fallara con errores de conexion o devolvera paginas de bloqueo.
# Compruebelo con `preflight` antes de confiar la recoleccion a este mecanismo.
# La opcion recomendada es cron en una maquina en Colombia (ver docs/DESPLIEGUE.md).
#
# Ademas, el planificador de GitHub Actions NO es puntual: puede retrasarse 5-15
# minutos en horas de carga. Para la escalera de ventanas anchas es tolerable,
# pero degrada la calidad de la LINEA DE CIERRE, que es justamente el dato de
# mayor valor del estudio.

on:
  schedule:
    - cron: "*/15 * * * *"      # cada 15 minutos (UTC)
  workflow_dispatch:

concurrency:
  group: captura                 # nunca dos ticks a la vez sobre el mismo estado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sports-betting-market-inefficiencies-9lvgya

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar configuracion
        env:
          CONFIG_YAML: ${{ secrets.VEEE_CONFIG_YAML }}
        run: |
          if [ -z "$CONFIG_YAML" ]; then
            echo "::error::Falta el secreto VEEE_CONFIG_YAML con la configuracion calibrada."
            exit 1
          fi
          printf '%s' "$CONFIG_YAML" > config/config.yaml

      - name: Preflight
        run: python scripts/preflight.py

      - name: Tick de captura
        id: captura
        run: |
          set +e
          python scripts/capture.py --json > tick.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat tick.json
        continue-on-error: true

      - name: Publicar los datos capturados
        run: |
          git config user.name  "veee-capture[bot]"
          git config user.email "veee-capture@users.noreply.github.com"
          git add -f data/veee.db outputs/decisiones/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "datos: tick de captura $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin \
                claude/sports-betting-market-inefficiencies-9lvgya && \
              git push origin HEAD && break
              sleep $((2 ** i))
            done
          fi

      - name: Fallar si la salud del extractor es mala
        run: |
          code=${{ steps.captura.outputs.exit_code }}
          case "$code" in
            0) echo "Captura correcta." ;;
            2) echo "::warning::Alerta de salud: cayo el volumen capturado."; exit 1 ;;
            3) echo "::error::CRITICO: cero filas. El extractor esta roto."; exit 1 ;;
            *) echo "::error::Fallo de ejecucion (codigo $code)."; exit 1 ;;
          esac
